<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>写给欣冉</title>
<style>
  :root{
    --bg1:#fff7f9;
    --bg2:#ffe9ef;
    --panel:#ffffff;
    --panel-soft:#fff1f5;
    --pink:#ff8fab;
    --pink-deep:#ff6289;
    --text:#4a3b3f;
    --muted:#9a8388;
    --line:#ffd7e2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:linear-gradient(160deg, var(--bg1), var(--bg2));
    display:flex;align-items:center;justify-content:center;
    font-family:"Heiti SC","SimHei","Microsoft YaHei",Arial,sans-serif;
    color:var(--text);
    padding:20px;
  }
  .card{
    position:relative;
    width:min(94vw, 400px);
    padding:32px 26px;
    background:var(--panel);
    border-radius:24px;
    box-shadow:0 16px 40px rgba(255,98,137,0.18), 0 2px 8px rgba(0,0,0,0.04);
    min-height:440px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;text-align:center;
  }
  h1{
    font-family:"Heiti SC","SimHei","Microsoft YaHei",Arial,sans-serif;
    font-weight:900;
    font-size:22px;
    line-height:1.6;
    color:var(--pink-deep);
    margin:0 0 4px;
  }
  p{font-size:16px;color:var(--muted);margin:0;line-height:1.7;}
  .pic{width:150px;height:150px;object-fit:cover;border-radius:20px;
       box-shadow:0 8px 20px rgba(255,98,137,0.25);}
  .screen{display:none;flex-direction:column;align-items:center;gap:16px;width:100%;}
  .screen.active{display:flex;}
  .btn{
    font-family:"Heiti SC","SimHei","Microsoft YaHei",Arial,sans-serif;
    font-weight:bold;
    font-size:16px;
    padding:12px 26px;
    color:#fff;
    background:linear-gradient(135deg, var(--pink), var(--pink-deep));
    border:none;border-radius:999px;
    box-shadow:0 6px 16px rgba(255,98,137,0.35);
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 3px 10px rgba(255,98,137,0.3);}
  .btn.ghost{background:var(--panel-soft);color:var(--pink-deep);box-shadow:none;border:2px solid var(--line);}
  .row{display:flex;gap:16px;position:relative;width:100%;justify-content:center;min-height:56px;flex-wrap:wrap;}
  #noBtn{transition:left .12s, top .12s;}
  #noBtn.dodging{position:fixed;z-index:50;margin:0;}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
  .choice{
    padding:14px 6px;background:var(--panel-soft);border-radius:14px;
    box-shadow:none;border:2px solid var(--line);
    cursor:pointer;font-size:15px;color:var(--text);
    transition:background .15s, border-color .15s;
  }
  .choice.selected{background:linear-gradient(135deg, var(--pink), var(--pink-deep));color:#fff;border-color:transparent;}
  .choice[data-disabled="true"]{opacity:.55;cursor:not-allowed;color:var(--muted);}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);}
  }
  .shake{animation:shake .4s;}
  .date-picks{display:flex;align-items:center;gap:8px;font-size:18px;}
  select{
    font-family:"Heiti SC","SimHei","Microsoft YaHei",Arial,sans-serif;
    font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);
    background:var(--panel-soft);color:var(--text);
  }
  .envelope{font-size:60px;cursor:pointer;}
  .letter{font-size:16px;line-height:1.9;color:var(--text);text-align:left;}
  .hint{font-size:12px;color:var(--muted);}
</style>
</head>
<body>

<div class="card">

  <!-- 第 1 屏：表白 -->
  <section class="screen active" data-screen="ask">
    <img class="pic" src="images/blush.jpg" alt="害羞的猫">
    <h1>你愿意做我女朋友嘛</h1>
    <div class="row">
      <button class="btn" id="yesBtn1">YES</button>
      <button class="btn ghost" id="noBtn">No</button>
    </div>
  </section>

  <!-- 第 2 屏：确认 -->
  <section class="screen" data-screen="confirm">
    <h1>你确定吗？</h1>
    <div class="row" style="position:static;">
      <button class="btn" id="yesBtn2">当然！</button>
    </div>
  </section>

  <!-- 第 3 屏：庆祝 -->
  <section class="screen" data-screen="celebrate">
    <img class="pic" src="images/deal.jpg" alt="成交">
    <h1>耶！</h1>
    <p>你答应我，我真的好开心。</p>
    <button class="btn" id="toActivity">按一下继续 →</button>
  </section>

  <!-- 第 4 屏：选活动 -->
  <section class="screen" data-screen="activity">
    <img class="pic" src="images/think.jpg" alt="思考中">
    <h1>你想一起做什么？</h1>
    <p>选一个你想和我一起做的</p>
    <div class="choice-grid" id="choiceGrid">
      <div class="choice" data-v="自驾旅行">🚗 自驾旅行</div>
      <div class="choice" data-v="图书馆学习">📚 图书馆学习</div>
      <div class="choice" data-v="吃火锅">🍲 吃火锅</div>
      <div class="choice" data-v="看电影">🎬 看电影</div>
      <div class="choice" data-v="以上都不想" data-disabled="true">🙅 以上都不想</div>
      <div class="choice" data-v="以上都想">💗 以上都想</div>
    </div>
    <button class="btn" id="toDate">就决定是这个了 🔒</button>
  </section>

  <!-- 第 5 屏：选纪念日 -->
  <section class="screen" data-screen="date">
    <img class="pic" src="images/oi.jpg" alt="oi">
    <h1>选一天作为纪念日啦</h1>
    <p>选一个月份和日期，作为我们的纪念日。</p>
    <div class="date-picks">
      <select id="monthSelect"></select><span>月</span>
      <select id="daySelect"></select><span>日</span>
    </div>
    <a class="btn" id="toLetter" href="#">继续 →</a>
    <p class="hint">点击继续会自动打开邮件，把你的选择发给我～</p>
  </section>

  <!-- 第 6 屏：情书 -->
  <section class="screen" data-screen="letter">
    <img class="pic" src="images/hug.jpg" alt="抱在一起" id="envImg">
    <div class="envelope" id="envelope">✉️</div>
    <p id="envHint">❤ 情书.txt</p>
    <div class="letter" id="letterBody" style="display:none;">
      不管怎样，欣冉同学都真的超可爱的。<br><br>
      对不起哎过去会让你有一些不美好的回忆，我们未来可以创造更多美好回忆嘛。<br><br>
      唔，我会努力让自己达到欣冉同学的要求的！<br><br>
      今天，以及每一天，我都有在想你，并且庆幸这一切。
    </div>
    <p id="finalLine" style="display:none;">就这样约了！💌</p>
    <button class="btn ghost" id="replay" style="display:none;">再看一次</button>
  </section>

</div>

<script>
// !!! 这里改成你真正要收邮件的邮箱地址 !!!
const MAIL_TO = "lhqbit@163.com";

// ---------- 屏幕切换 ----------
function goTo(name){
  document.querySelectorAll('.screen').forEach(s=>{
    s.classList.toggle('active', s.dataset.screen === name);
  });
  if(name === 'ask'){
    const nb = document.getElementById('noBtn');
    nb.classList.remove('dodging');
    nb.style.left = '';
    nb.style.top  = '';
  }
}

// ---------- 第1屏：No 按钮闪避 ----------
const noBtn = document.getElementById('noBtn');
const card  = document.querySelector('.card');
function dodge(){
  const rect = card.getBoundingClientRect();
  const pad  = 14;
  const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
  const maxX = Math.max(rect.width  - bw - pad*2, 0);
  const maxY = Math.max(rect.height - bh - pad*2, 0);
  const x = rect.left + pad + Math.random()*maxX;
  const y = rect.top  + pad + Math.random()*maxY;
  noBtn.classList.add('dodging');
  noBtn.style.left = x + 'px';
  noBtn.style.top  = y + 'px';
}
noBtn.addEventListener('mouseenter', dodge);
noBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodge(); }, {passive:false});
noBtn.addEventListener('click', (e)=>{ e.preventDefault(); dodge(); });

document.getElementById('yesBtn1').onclick = ()=>goTo('confirm');
document.getElementById('yesBtn2').onclick = ()=>goTo('celebrate');
document.getElementById('toActivity').onclick = ()=>goTo('activity');

// ---------- 第4屏：选活动（“以上都不想”点不上，抖一下拒绝） ----------
let selectedActivity = '';
document.querySelectorAll('.choice').forEach(c=>{
  c.onclick = ()=>{
    if(c.dataset.disabled === 'true'){
      c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      return;
    }
    document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected');
    selectedActivity = c.dataset.v;
  };
});
document.getElementById('toDate').onclick = ()=>goTo('date');

// ---------- 第5屏：月份/日期选择 ----------
const monthSelect = document.getElementById('monthSelect');
const daySelect   = document.getElementById('daySelect');
for(let m=1;m<=12;m++){
  const opt = document.createElement('option');
  opt.value = m; opt.textContent = m;
  monthSelect.appendChild(opt);
}
function fillDays(days){
  const cur = daySelect.value;
  daySelect.innerHTML = '';
  for(let d=1; d<=days; d++){
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    daySelect.appendChild(opt);
  }
  if(cur && cur <= days) daySelect.value = cur;
}
function daysInMonth(m){
  return [31,29,31,30,31,30,31,31,30,31,30,31][m-1];
}
monthSelect.onchange = ()=>fillDays(daysInMonth(+monthSelect.value));
fillDays(31);

// ---------- 继续：打开邮件 + 进入情书页 ----------
document.getElementById('toLetter').addEventListener('click', function(e){
  e.preventDefault();
  const activity = selectedActivity || '（还没选）';
  const month = monthSelect.value;
  const day   = daySelect.value;
  const subject = encodeURIComponent('情人节小问卷的回答');
  const body = encodeURIComponent(
    '想一起做的事：' + activity + '\n' +
    '纪念日：' + month + '月' + day + '日'
  );
  window.location.href = 'mailto:' + MAIL_TO + '?subject=' + subject + '&body=' + body;
  goTo('letter');
});

// ---------- 第6屏：拆信 ----------
const envelope = document.getElementById('envelope');
envelope.onclick = ()=>{
  envelope.style.display = 'none';
  document.getElementById('envHint').style.display = 'none';
  document.getElementById('letterBody').style.display = 'block';
  document.getElementById('finalLine').style.display = 'block';
  document.getElementById('replay').style.display = 'inline-block';
};
document.getElementById('replay').onclick = ()=>{
  envelope.style.display = 'block';
  document.getElementById('envHint').style.display = 'block';
  document.getElementById('letterBody').style.display = 'none';
  document.getElementById('finalLine').style.display = 'none';
  document.getElementById('replay').style.display = 'none';
  goTo('ask');
};
</script>
</body>
</html>
